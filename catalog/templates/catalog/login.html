<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Sitio de Julián</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #334155;
        }
        .login-card h1 {
            color: #38bdf8;
            font-size: 26px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .login-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        form p {
            text-align: left;
            margin-bottom: 18px;
        }
        form label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 600;
        }
        form input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        form input:focus {
            border-color: #38bdf8;
        }
        .errorlist {
            color: #ef4444;
            font-size: 13px;
            list-style: none;
            margin-bottom: 15px;
            text-align: left;
        }
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s, transform 0.1s;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .register-link {
            margin-top: 25px;
            display: block;
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
        }
        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Bienvenido al sitio de Julián 🎬✨</h1>
        <p>Tu plataforma exclusiva de streaming de anime. Inicia sesión para acceder al catálogo y ver los capítulos.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Iniciar Sesión</button>
        </form>

        <a href="{% url 'registro' %}" class="register-link">¿No tienes una cuenta? Regístrate aquí</a>
    </div>

</body>
</html>
