<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeHub - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para darle formato a las cajas de texto de Django */
        form p {
            margin-bottom: 1.25rem;
        }
        form label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #d8b4fe; /* Color morado claro */
            margin-bottom: 0.375rem;
        }
        form input[type="text"], 
        form input[type="password"] {
            width: 100%;
            background-color: #111827; /* Fondo oscuro claro */
            color: #ffffff; /* Texto blanco legible */
            border: 1px solid #4c1d95; /* Borde morado */
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            outline: none;
            transition: all 0.2s ease-in-out;
        }
        form input[type="text"]:focus, 
        form input[type="password"]:focus {
            border-color: #ec4899; /* Borde rosa neón al hacer clic */
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
        }
        .errorlist {
            color: #f87171;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            list-style: none;
            padding: 0;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-900 p-8 rounded-2xl shadow-2xl border border-purple-800 w-full max-w-md relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-pink-600 rounded-full blur-3xl opacity-20"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-600 rounded-full blur-3xl opacity-20"></div>

        <h2 class="text-3xl font-black text-center text-pink-500 mb-6 tracking-wider">🔥 INICIAR SESIÓN</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold py-3 rounded-lg transition duration-200 mt-2 shadow-lg hover:shadow-pink-500/25">
                Entrar
            </button>
        </form>

        <p class="text-gray-400 text-sm text-center mt-6">
            ¿No tienes una cuenta? 
            <a href="{% url 'registro' %}" class="text-pink-400 hover:text-pink-300 font-semibold underline">Regístrate aquí</a>
        </p>
        <div class="text-center mt-4">
            <a href="{% url 'home' %}" class="text-xs text-gray-500 hover:text-gray-300">← Volver al inicio</a>
        </div>
    </div>
</body>
</html>
