<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeHub - Registrarse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para dar formato a las cajas de registro */
        form p {
            margin-bottom: 1.25rem;
        }
        form label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #c084fc; /* Morado neón */
            margin-bottom: 0.375rem;
        }
        form input[type="text"], 
        form input[type="password"],
        form input[type="email"] {
            width: 100%;
            background-color: #111827;
            color: #ffffff; /* Texto blanco totalmente visible */
            border: 1px solid #4c1d95;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            outline: none;
            transition: all 0.2s ease-in-out;
        }
        form input[type="text"]:focus, 
        form input[type="password"]:focus,
        form input[type="email"]:focus {
            border-color: #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }
        .helptext {
            display: block;
            font-size: 0.75rem;
            color: #9ca3af; /* Texto de ayuda gris claro */
            margin-top: 0.375rem;
            line-height: 1.2;
        }
        .helptext ul {
            list-style-type: disc;
            margin-left: 1.25rem;
            margin-top: 0.25rem;
        }
        .errorlist {
            color: #f87171;
            font-size: 0.85rem;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.5rem;
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
            list-style: none;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-900 p-8 rounded-2xl shadow-2xl border border-purple-800 w-full max-w-lg relative overflow-hidden">
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-purple-600 rounded-full blur-3xl opacity-20"></div>

        <h2 class="text-3xl font-black text-center text-purple-400 mb-6 tracking-wider">🚀 CREAR CUENTA</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-3 rounded-lg transition duration-200 mt-4 shadow-lg hover:shadow-purple-500/25">
                Registrarme
            </button>
        </form>

        <p class="text-gray-400 text-sm text-center mt-6">
            ¿Ya tienes una cuenta? 
            <a href="{% url 'login' %}" class="text-purple-400 hover:text-purple-300 font-semibold underline">Inicia sesión</a>
        </p>
        <div class="text-center mt-4">
            <a href="{% url 'home' %}" class="text-xs text-gray-500 hover:text-gray-300">← Volver al inicio</a>
        </div>
    </div>
</body>
</html>
